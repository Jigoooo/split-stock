appId: app.split-stock
productName: split-stock
copyright: Copyright © 2026 split-stock

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - drizzle/**/*
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!**/*.map'

extraResources:
  - from: drizzle
    to: drizzle
    filter:
      - '**/*'

asar: true

# 자동업데이트 — dev 채널 (서명 생략, GitHub Releases 기본)
publish:
  provider: generic
  url: https://example.invalid/split-stock/updates
  channel: latest

mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  signAndEditExecutable: false
  signtoolOptions:
    publisherName: split-stock (unsigned dev build)

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Office
